name: Nightly threat-intel enrichment

# Refresh CISA KEV + live EPSS and re-score every finding, nightly at 07:00 UTC.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger enrichment
        env:
          APP_URL: ${{ secrets.VULN_APP_URL }}
          ADMIN_TOKEN: ${{ secrets.VULN_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          BASE="${APP_URL:-https://gmi-vuln-opmy8.ondigitalocean.app}"
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo "VULN_ADMIN_TOKEN secret not set." >&2; exit 1
          fi
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST \
            -H "x-admin-token: ${ADMIN_TOKEN}" "$BASE/api/admin/enrich" || true)
          echo "HTTP $code"; cat /tmp/r.json; echo
          test "$code" = "200"
