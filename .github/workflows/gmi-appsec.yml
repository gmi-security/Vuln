name: GMI AppSec

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: scan
        type: choice
        options:
          - scan
          - baseline
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  appsec:
    name: GMI Trivy AppSec
    runs-on: [self-hosted, appsec, trivy]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify scanner
        shell: bash
        run: |
          set -euo pipefail
          command -v gmi-appsec-ci
          curl -fsS http://127.0.0.1:8089/healthz | jq -e '.status == "ok"'

      - name: Establish baseline
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[appsec-baseline]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'baseline') }}
        shell: bash
        run: gmi-appsec-ci --baseline "$GITHUB_WORKSPACE" "$GITHUB_REPOSITORY"

      - name: Run delta gate
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[appsec-baseline]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scan') || github.event_name == 'schedule' }}
        shell: bash
        run: gmi-appsec-ci "$GITHUB_WORKSPACE" "$GITHUB_REPOSITORY"
