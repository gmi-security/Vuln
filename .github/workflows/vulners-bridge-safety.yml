name: Vulners Bridge safety regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/store.ts'
      - 'lib/customer-scanner-routing-server.ts'
      - 'tests/manual-ticket-scheduling.test.mjs'
      - '.github/workflows/vulners-bridge-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Bridge scheduler and reviewed customer routing
        run: node --experimental-vm-modules --test tests/manual-ticket-scheduling.test.mjs tests/customer-scanner-routing.test.mjs
      - name: TypeScript typecheck
        run: npx tsc --noEmit
