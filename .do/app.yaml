# DigitalOcean App Platform spec for the GMI Vuln console.
# Import via: Apps -> Create App -> or `doctl apps create --spec .do/app.yaml`.
# Fill in the two SECRET values (Nessus API keys) when prompted.
name: gmi-vuln
region: nyc
services:
  - name: web
    environment_slug: node-js
    github:
      repo: gmi-security/Vuln
      branch: claude/vuln-site-design-vxswd6
      deploy_on_push: true
    build_command: npm run build
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      # Node's V8 heap defaults to ~2-4GB regardless of the container's actual
      # RAM — on a large in-memory store (tens of thousands of findings, plus
      # large API responses held in memory during sync) that default ceiling
      # causes long GC pauses that look like the app hanging. Raises the heap
      # ceiling to make real use of a bigger instance; ~75% of the container's
      # RAM, leaving headroom for the OS and non-heap Node overhead. Update
      # this if the instance size changes.
      - key: NODE_OPTIONS
        scope: RUN_TIME
        value: "--max-old-space-size=24576"
      - key: GITHUB_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: GITHUB_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: NEXTAUTH_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: NEXTAUTH_URL
        scope: RUN_TIME
        value: "https://gmi-vuln-opmy8.ondigitalocean.app"
      - key: GMI_ALLOWED_ORG
        scope: RUN_TIME
        value: "gmi-security"
      - key: NESSUS_URL
        scope: RUN_TIME
        value: "https://137.184.89.60:8834"
      - key: NESSUS_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NESSUS_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NESSUS_TLS_INSECURE
        scope: RUN_TIME
        value: "1"
